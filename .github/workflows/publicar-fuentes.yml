name: Publicar microservicios desde ZIP existente
on:
  push:
    branches:
      - feature/publicar-microservicios-fuentes-20261119
    paths:
      - .github/workflows/publicar-fuentes.yml

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extraer los cuatro microservicios como código versionado
        shell: bash
        run: |
          set -euo pipefail
          unzip -q backend-seguros-bpo-main.zip -d .tmp_fuentes
          original=".tmp_fuentes/backend-seguros-bpo-main"
          for service in roles-service usuarios-service catalogos-service siniestros-service; do
            test -f "$original/$service/pom.xml"
            cp -a "$original/$service" .
            test -d "$service/src/main/java"
          done
          # Saneamiento antes de publicar archivos fuente: no conservar URI Atlas.
          for service in roles-service usuarios-service catalogos-service siniestros-service; do
            sed -i -E '/^[[:space:]]*spring[.]mongodb[.]uri[[:space:]]*=/d' "$service/src/main/resources/application.properties"
          done
          if grep -R -q -E 'mongodb[+]srv://|abaylas_db_user' \
              roles-service usuarios-service catalogos-service siniestros-service; then
            echo 'ERROR: se ha detectado una cadena Atlas en el código.'
            exit 1
          fi
          git rm -- backend-seguros-bpo-main.zip
          git add roles-service usuarios-service catalogos-service siniestros-service
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(backend): publicar código fuente de los cuatro microservicios'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Confirmar carpetas visibles
        shell: bash
        run: |
          test -f roles-service/pom.xml
          test -f usuarios-service/pom.xml
          test -f catalogos-service/pom.xml
          test -f siniestros-service/pom.xml
