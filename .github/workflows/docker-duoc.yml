name: Docker Duoc - cuatro microservicios

on:
  push:
    paths:
      - 'roles-service/**'
      - 'usuarios-service/**'
      - 'catalogos-service/**'
      - 'siniestros-service/**'
      - 'docker/**'
      - 'compose.yaml'
      - '.github/workflows/docker-duoc.yml'
  pull_request:
    paths:
      - 'roles-service/**'
      - 'usuarios-service/**'
      - 'catalogos-service/**'
      - 'siniestros-service/**'
      - 'docker/**'
      - 'compose.yaml'
      - '.github/workflows/docker-duoc.yml'

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar código fuente y ausencia de URI Atlas
        shell: bash
        run: |
          set -euo pipefail
          for service in roles-service usuarios-service catalogos-service siniestros-service; do
            test -f "$service/pom.xml"
            test -d "$service/src/main/java"
          done
          if grep -R -q -E 'mongodb[+]srv://|abaylas_db_user' \
            roles-service usuarios-service catalogos-service siniestros-service; then
            echo 'ERROR: URI Atlas encontrada en el código fuente'; exit 1
          fi
      - name: Configurar MongoDB local de CI
        run: |
          printf 'MONGO_USER=segurosbpo\nMONGO_PASS=TEST0123456789ABCDEF1234567890\n' > .env
      - name: Validar configuración Compose
        run: docker compose config --quiet
      - name: Construir e iniciar los cinco contenedores
        run: docker compose up --build -d --wait --wait-timeout 420
      - name: Verificar las cuatro API REST
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent http://127.0.0.1:8081/api/roles >/dev/null
          curl --fail --show-error --silent http://127.0.0.1:8082/api/usuarios >/dev/null
          curl --fail --show-error --silent http://127.0.0.1:8083/api/companias >/dev/null
          curl --fail --show-error --silent 'http://127.0.0.1:8084/api/siniestros?sinAsignar=true' >/dev/null
      - name: Información de diagnóstico si falla
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=120 || true
      - name: Detener contenedores
        if: always()
        run: docker compose down --remove-orphans || true
