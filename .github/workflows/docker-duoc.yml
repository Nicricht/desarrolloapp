name: Docker Duoc - integracion cuatro microservicios

on:
  push:
    paths:
      - 'roles-service/**'
      - 'usuarios-service/**'
      - 'catalogos-service/**'
      - 'siniestros-service/**'
      - 'docker/**'
      - 'compose.yaml'
      - 'compose.ci.yaml'
      - 'scripts/**'
      - '.github/workflows/docker-duoc.yml'
  pull_request:
    paths:
      - 'roles-service/**'
      - 'usuarios-service/**'
      - 'catalogos-service/**'
      - 'siniestros-service/**'
      - 'docker/**'
      - 'compose.yaml'
      - 'compose.ci.yaml'
      - 'scripts/**'
      - '.github/workflows/docker-duoc.yml'

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar servicios y ausencia de credenciales Atlas versionadas
        shell: bash
        run: |
          set -euo pipefail
          for service in roles-service usuarios-service catalogos-service siniestros-service; do
            test -f "$service/pom.xml"
            test -d "$service/src/main/java"
          done
          if grep -R -q -E 'mongodb[+]srv://[^[:space:]]+@' \
             roles-service usuarios-service catalogos-service siniestros-service; then
            echo 'ERROR: URI Atlas con credenciales embebidas en el codigo'; exit 1
          fi
      - name: Probar importador PowerShell Atlas con ZIP de prueba
        run: python3 tests/test_atlas_import.py
      - name: Inyectar URI descartable de CI (no Atlas)
        shell: bash
        run: |
          cat > .env <<'EOF'
          ATLAS_ROLES_URI=mongodb://ci:ci-password-only@mongodb:27017/segurosbpo_roles?authSource=admin
          ATLAS_USUARIOS_URI=mongodb://ci:ci-password-only@mongodb:27017/segurosbpo_usuarios?authSource=admin
          ATLAS_CATALOGOS_URI=mongodb://ci:ci-password-only@mongodb:27017/segurosbpo_catalogos?authSource=admin
          ATLAS_SINIESTROS_URI=mongodb://ci:ci-password-only@mongodb:27017/segurosbpo_siniestros?authSource=admin
          EOF
      - name: Verificar que Compose de Duoc no levanta MongoDB
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --services | tee /tmp/services.txt
          ! grep -qx mongodb /tmp/services.txt
          test "$(wc -l < /tmp/services.txt)" -eq 4
      - name: Validar configuracion de CI
        run: docker compose -f compose.yaml -f compose.ci.yaml config --quiet
      - name: Construir e iniciar cinco contenedores solo para pruebas CI
        run: docker compose -f compose.yaml -f compose.ci.yaml up --build -d --wait --wait-timeout 420
      - name: Verificar cuatro APIs y dependencias
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8081/api/roles >/dev/null
          curl -fsS http://127.0.0.1:8082/api/usuarios >/dev/null
          curl -fsS http://127.0.0.1:8083/api/companias >/dev/null
          curl -fsS 'http://127.0.0.1:8084/api/siniestros?sinAsignar=true' >/dev/null
      - name: Diagnostico si falla
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml ps || true
          docker compose -f compose.yaml -f compose.ci.yaml logs --tail=120 || true
      - name: Finalizar contenedores
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down --remove-orphans || true
