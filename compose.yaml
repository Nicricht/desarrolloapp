name: seguros-bpo-duoc

# Produccion academica/demo: el backend se conecta al Atlas ORIGINAL.
# Las cuatro URI se leen de .env local, nunca de codigo versionado.
services:
  roles-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: roles-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_MONGODB_URI: ${ATLAS_ROLES_URI:?Falta Atlas. Ejecuta scripts/iniciar-duoc.ps1 con el ZIP original}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s

  catalogos-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: catalogos-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SPRING_MONGODB_URI: ${ATLAS_CATALOGOS_URI:?Falta Atlas. Ejecuta scripts/iniciar-duoc.ps1 con el ZIP original}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8083"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s

  usuarios-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: usuarios-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_MONGODB_URI: ${ATLAS_USUARIOS_URI:?Falta Atlas. Ejecuta scripts/iniciar-duoc.ps1 con el ZIP original}
      ROLES_SERVICE_URL: http://roles-service:8081
    depends_on:
      roles-service:
        condition: service_healthy
    volumes:
      - avatares-data:/app/uploads/avatares
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s

  siniestros-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE: siniestros-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SPRING_MONGODB_URI: ${ATLAS_SINIESTROS_URI:?Falta Atlas. Ejecuta scripts/iniciar-duoc.ps1 con el ZIP original}
      CATALOGOS_SERVICE_URL: http://catalogos-service:8083
      USUARIOS_SERVICE_URL: http://usuarios-service:8082
    depends_on:
      catalogos-service:
        condition: service_healthy
      usuarios-service:
        condition: service_healthy
    volumes:
      - evidencias-data:/app/uploads/evidencias
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8084"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s

volumes:
  avatares-data:
  evidencias-data:
